<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Precios</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #f8fafc; /* Color de fondo base ligero gris-azulado */
            --glass-bg: rgba(255, 255, 255, 0.75); /* Transparencia para glassmorphism */
            --glass-border: rgba(255, 255, 255, 0.4);
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
        }

        body { 
            background-color: var(--primary-bg);
            font-family: 'Outfit', sans-serif;
            color: #1e293b;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Glassmorphism Navbar */
        .navbar-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 0;
            transition: all 0.3s ease;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #4f46e5 0%, #0ea5e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* Nav Pills Buttons */
        .nav-btn {
            border-radius: 50px;
            padding: 0.5rem 1.25rem;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn-fav {
            background-color: #fee2e2;
            color: #ef4444;
            border: 1px solid transparent;
        }
        .nav-btn-fav:hover {
            background-color: #fca5a5;
            color: #b91c1c;
            transform: translateY(-2px);
        }

        .nav-btn-danger {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        .nav-btn-danger:hover {
            background-color: #ef4444;
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .nav-btn-login {
            color: #4b5563;
            border: 1px solid #d1d5db;
        }
        .nav-btn-login:hover {
            background-color: #f3f4f6;
            color: #1f2937;
        }

        .nav-btn-signup {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }
        .nav-btn-signup:hover {
            background: linear-gradient(135deg, #4338ca 0%, #2563eb 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .user-greeting {
            font-weight: 500;
            color: #475569;
        }
        
        .valoracion-cell { font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light navbar-glass">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            <span style="-webkit-text-fill-color: initial;">🛍️</span> CompaRadar
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border:none; padding:0;">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="ms-auto d-flex flex-column flex-lg-row align-items-lg-center mt-3 mt-lg-0 gap-3">
                {% if user.is_authenticated %}
                    <span class="user-greeting">
                        Hola, <strong class="text-dark">{{ user.username }}</strong> 👋
                    </span>
                    <a href="{% url 'favoritos' %}" class="nav-btn nav-btn-fav text-decoration-none">
                        <span>❤️</span> Favoritos
                    </a>
                    
                    <form action="{% url 'logout' %}" method="post" class="d-inline m-0 p-0">
                        {% csrf_token %}
                        <button type="submit" class="nav-btn nav-btn-danger">
                            Cerrar Sesión
                        </button>
                    </form>

                {% else %}
                    <a href="{% url 'login' %}" class="nav-btn nav-btn-login text-decoration-none">
                        Iniciar Sesión
                    </a>
                    <a href="{% url 'signup' %}" class="nav-btn nav-btn-signup text-decoration-none">
                        Registrarse
                    </a>
                {% endif %}
            </div>
        </div>
      </div>
    </nav>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
